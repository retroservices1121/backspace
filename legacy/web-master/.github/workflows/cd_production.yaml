name: Deploy Release to Production
'on':
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci; # cd functions; npm ci; cd ../
      - name: Build site
        run: npm run build:prod
      # - name: Build cloud functions
      #   run: npm run build_functions
      - name: Update Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKCHANNEL_PRODUCTION_LIVE }}
          PROJECT_ID: backchannel-production-live
      - name: Update Realtime Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only database:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKCHANNEL_PRODUCTION_LIVE }}
          PROJECT_ID: backchannel-production-live
      - name: Update Storage Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKCHANNEL_PRODUCTION_LIVE }}
          PROJECT_ID: backchannel-production-live
      - name: Update Firestore Indexes
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKCHANNEL_PRODUCTION_LIVE }}
          PROJECT_ID: backchannel-production-live
      - name: Deploy to Firebase Hosting
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKCHANNEL_PRODUCTION_LIVE }}
          PROJECT_ID: backchannel-production-live
      # - name: Deploy to Firebase Functions
      #   uses: w9jds/firebase-action@master
      #   with:
      #     args: deploy --only functions
      #   env:
      #     GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BACKCHANNEL_PRODUCTION_LIVE }}
      #     PROJECT_ID: backchannel-production-live
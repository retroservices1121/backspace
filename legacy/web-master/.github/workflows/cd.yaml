      #   with:
      #     args: deploy --only functions
      #   env:
      #     GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEWSOCIAL_PROTOTYPE }}
      #     PROJECT_ID: newsocial-prototype


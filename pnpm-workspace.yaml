packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  '@reown/appkit': false
  bufferutil: false
  core-js: false
  core-js-pure: false
  dtrace-provider: false
  es5-ext: false
  esbuild: false
  keccak: false
  prisma: false
  protobufjs: false
  puppeteer: false
  unrs-resolver: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - '@expo/ui@57.0.22'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo-router@57.0.25
  - expo@57.0.27
